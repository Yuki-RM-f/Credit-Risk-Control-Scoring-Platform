[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "credit-risk-scoring-platform"
version = "0.1.0"
description = "Streamlit MVP for a Home Credit risk scoring operations platform"
requires-python = ">=3.12"
dependencies = [
  "joblib>=1.4",
  "numpy>=2.1",
  "pandas>=2.2",
  "plotly>=5.24",
  "pyarrow>=17.0",
  "scikit-learn>=1.5",
  "shap>=0.46",
  "streamlit>=1.39",
  "xgboost>=2.1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
